version: v2

clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/datakit-dev/dtkt-sdk/sdk-go/proto
    - file_option: java_package_prefix
      value: proto
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/google/cel-spec
    - file_option: go_package
      module: buf.build/googleapis/googleapis

inputs:
  - directory: proto
  - module: buf.build/googleapis/googleapis
    paths:
      - google/longrunning

plugins:
  # Go
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: sdk-go/proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: sdk-go/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: sdk-go/proto
    opt: paths=source_relative
    # Only generate Connect for googleapis longrunning
    include_imports: false
  - local: protoc-gen-gosrcinfo
    out: sdk-go/proto
    opt: paths=source_relative

  # TypeScript
  - remote: buf.build/bufbuild/es:v2.15.0
    opt:
      - target=ts
      - valid_types=protovalidate_required
    out: sdk-ts/src/proto
    include_imports: true
    include_wkt: true
  - remote: buf.build/connectrpc/query-es:v2.3.1
    out: sdk-ts/src/proto
    opt:
      - target=ts

  # Python
  - remote: buf.build/bufbuild/py:v0.6.0
    out: sdk-py/dtkt_sdk/gen
    opt:
      - init_files=false
    include_imports: true
  - remote: buf.build/connectrpc/py
    out: sdk-py/dtkt_sdk/gen
