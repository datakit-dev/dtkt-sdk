syntax = "proto3";

package dtkt.protostore.v1beta1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/datakit-dev/dtkt-sdk/sdk-go/proto/dtkt/protostore/v1beta1";

extend google.protobuf.MessageOptions {
  repeated Edge edges = 50006;
  SearchIndex search_index = 50007;
}

extend google.protobuf.FieldOptions {
  optional Field field = 50005;
}

message Field {
  optional string name = 1;
  optional bool nullable = 2;
  optional bool unique = 3;
  optional bool sensitive = 4;
  optional bool immutable = 5;
  optional bool skip = 6;
  optional bool primary = 7;
}

message Edge {
  optional bool unique = 1;
  optional string ref = 2;
  optional bool required = 3;
  optional string field = 4;
}

message SearchIndex {
  // CEL expression which must resolve to a string value containing text
  // contents to be indexed for full-text and/or semantic search.
  // The message of the declared option is `this` in the CEL expression context.
  // Example: contents_expr: "this.title + ' ' + this.description"
  optional string contents_expr = 1;
}
