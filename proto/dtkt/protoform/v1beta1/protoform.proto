syntax = "proto3";

package dtkt.protoform.v1beta1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/datakit-dev/dtkt-sdk/sdk-go/proto/dtkt/protoform/v1beta1";

extend google.protobuf.FieldOptions {
  optional FieldElement field = 50000;
}

message FieldElement {
  optional string title = 1;
  optional string description = 2;
  optional bool hidden = 3;

  oneof type {
    ConfirmElement confirm = 4;
    InputElement input = 5;
    FileElement file = 6;
    SelectElement select = 7;
    MultiSelectElement multi_select = 8;
  }
}

// Confirm element (approve/decline)
message ConfirmElement {
  string approve = 1;
  string decline = 2;
  bool default_selected = 3;
}

// Input element with multi-line text option
message InputElement {
  optional bool multiline_text = 1;
}

// File element
message FileElement {
  repeated string allowed_types = 2;
}

// Select element
message SelectElement {
  // A fully-qualified method name to call at runtime to retrieve options for
  // this select element. The method must return a message containing a repeated
  // field to be used as the options for this select element.
  string method_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "dtkt.example.GreetService.Greet"
  ];
  // Name of a repeated field within the method's response whose value defines
  // the select element's options.
  string response_field = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "messages"
  ];
  // CEL expression to extract the label for each select element option.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  string label_expr = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "this.text"
  ];
  // Optional CEL expression to extract the value for each select element option.
  // The resolved expression value must match the field type this option is
  // applied to.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  // Default: resolved list item value (dynamic).
  optional string value_expr = 4 [(buf.validate.field).string.example = "this.id"];
  // Optional CEL expression to filter options returned by method response by
  // only including options for which `filter_expr` returns `true`.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  optional string filter_expr = 5 [(buf.validate.field).string.example = "size(this.text) > 0"];
  // When defined, `filter_expr` is defined, and the method request contains a
  // `filter (string)` field, set its value to `filter_expr`.
  optional bool use_filter_field = 6;
}

// Multi-select element
message MultiSelectElement {
  // A fully-qualified method name to call at runtime to retrieve options for
  // this select element. The method must return a message containing a repeated
  // field to be used as the options for this select element.
  string method_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "dtkt.example.GreetService.Greet"
  ];
  // Name of a repeated field within the method's response whose value defines
  // the select element's options.
  string response_field = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "messages"
  ];
  // CEL expression to extract the label for each select element option.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  string label_expr = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.example = "this.text"
  ];
  // Optional CEL expression to extract the value for each select element option.
  // The resolved expression value must match the field type this option is
  // applied to.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  // Default: resolved list item value (dynamic).
  optional string value_expr = 4 [(buf.validate.field).string.example = "this.id"];
  // Optional CEL expression to filter options returned by method response by
  // only including options for which `filter_expr` returns `true`.
  // Each list item within the resolved `response_field` of the method's response
  // will be available as `this` in the CEL expression context.
  optional string filter_expr = 5 [(buf.validate.field).string.example = "size(this.text) > 0"];
  // When defined, `filter_expr` is defined, and the method request contains a
  // `filter (string)` field, set its value to `filter_expr`.
  optional bool use_filter_field = 6;
}
