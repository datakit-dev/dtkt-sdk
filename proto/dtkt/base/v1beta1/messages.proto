syntax = "proto3";

package dtkt.base.v1beta1;

import "buf/validate/validate.proto";
import "dtkt/shared/v1beta1/enums.proto";
import "dtkt/shared/v1beta1/messages.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/datakit-dev/dtkt-sdk/sdk-go/proto/dtkt/base/v1beta1";

// StreamIORequest is sent by the client over a bidirectional StreamIO stream.
//
// Protocol:
//   - The FIRST message establishes the stream and stdin may carry an initial
//     payload (e.g. a shell script to pipe into a subprocess).
//   - SUBSEQUENT messages carry additional stdin bytes.
//   - The client signals end-of-stdin by calling CloseSend (gRPC half-close),
//     which causes the server to close the instance stdin pipe so that any
//     blocking subprocess receives EOF.
message StreamIORequest {
  // Raw bytes to write to the instance stdin pipe.  Omit (or leave empty) for
  // messages that carry no input (e.g. a keep-alive or a stream-open with no
  // initial payload).
  optional bytes stdin = 1;
}

// StreamIOResponse is sent by the server over a bidirectional StreamIO stream.
//
// Each frame carries one of: a chunk of stdout bytes, a chunk of stderr bytes,
// or a terminal exit_code that signals how the underlying operation ended.
// The server sends an exit_code frame before closing the stream whenever the
// exit status is known; stream closure without an exit_code frame indicates
// the operation was cancelled or the stream context was terminated.
message StreamIOResponse {
  oneof type {
    option (buf.validate.oneof).required = true;

    // A chunk of bytes written to the instance stdout.
    bytes stdout = 1;

    // A chunk of bytes written to the instance stderr.
    bytes stderr = 2;

    // Terminal frame: exit status of the underlying operation.  Sent once,
    // immediately before the server closes the stream.  A value of 0 indicates
    // success; non-zero values follow standard Unix exit-code conventions.
    // Absence of this frame means the stream ended abnormally (e.g. context
    // cancellation).
    int32 exit_code = 3;
  }
}

// Request for getting package spec and config schema.
message GetPackageRequest {}

// Response for getting package spec and config schema.
message GetPackageResponse {
  // Embedded package spec (package.dtkt.yaml).
  dtkt.shared.v1beta1.Package package = 1 [(buf.validate.field).required = true];

  // Integration config schema used to validate CheckConfig.
  dtkt.shared.v1beta1.TypeSchema config_schema = 2 [(buf.validate.field).required = true];
}

// Request for checking config.
message CheckConfigRequest {
  // Connection resource name of provided config.
  string connection = 1 [(buf.validate.field).required = true];

  // Config to validate.
  google.protobuf.Any config_data = 2 [(buf.validate.field).required = true];

  // Hash of provided config.
  string config_hash = 3 [(buf.validate.field).required = true];

  // Generation of provided config.
  uint64 config_gen = 4 [(buf.validate.field).required = true];
}

// Response for checking config.
message CheckConfigResponse {
  // Auth type if auth is required.
  optional dtkt.shared.v1beta1.AuthType auth_required = 1;
}

// Request for checking config.
message CloseRequest {}

// Response of closing instance.
message CloseResponse {}

// Request for checking auth (3-legged OAuth over gRPC).
message CheckAuthRequest {
  oneof type {
    dtkt.shared.v1beta1.OAuthCodeRequest code_request = 2;
    dtkt.shared.v1beta1.OAuthTokenRequest token_request = 3;
    dtkt.shared.v1beta1.OAuthRefreshRequest refresh_request = 4;
  }
}

// Response for checking auth.
message CheckAuthResponse {
  // Auth type if auth is required.
  dtkt.shared.v1beta1.AuthType auth_required = 1;

  oneof type {
    // Returned when auth type is code.
    string oauth_code_url = 2;

    // Returned when auth type is token or refresh.
    dtkt.shared.v1beta1.OAuthToken token = 3;
  }
}

// Request for listing custom types.
message ListTypesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// Response for listing custom types.
message ListTypesResponse {
  // Custom types registered to integration.
  repeated dtkt.shared.v1beta1.TypeSchema types = 1;

  string next_page_token = 2;
}

// Request for getting custom type schema.
message GetTypeRequest {
  string name = 1 [(buf.validate.field).required = true];
}

// Response for getting custom type schema.
message GetTypeResponse {
  dtkt.shared.v1beta1.TypeSchema type = 1 [(buf.validate.field).required = true];
}
